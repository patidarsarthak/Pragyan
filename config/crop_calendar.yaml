        kc: 0.45
        critical: false
        water_requirement: "Low"
        source: "ICAR-DRMR Mustard Production Guidelines, p. 34"
        status: "ACTIVE"
      - id: "vegetative"
        name: "Vegetative Branching"
        start_day: 26
        end_day: 45
        gdd_req: 620
        kc: 0.80
        critical: false
        water_requirement: "Moderate"
        source: "ICAR-DRMR Mustard Production Guidelines, p. 37"
        status: "ACTIVE"
      - id: "flowering"
        name: "Flowering & Siliqua Formation"
        start_day: 46
        end_day: 75
        gdd_req: 1120
        kc: 1.05
        critical: true
        water_requirement: "Critical (Aphid & Frost Susceptibility Window)"
        source: "ICAR-DRMR Mustard Production Guidelines, p. 41"
        status: "ACTIVE"
      - id: "maturity"
        name: "Pod Maturation & Seed Hardening"
        start_day: 76
        end_day: 110
        gdd_req: 1550
        kc: 0.40
        critical: false
        water_requirement: "Low"
        source: "ICAR-DRMR Mustard Production Guidelines, p. 45"
        status: "ACTIVE"

  soybean:
    canonical_name: "Soybean"
    scientific_name: "Glycine max"
    season: "Kharif"
    base_temperature_c: 10.0 # Sourced: Major et al. (1975), ICAR-IISR Indore
    sowing_window:
      early: "15 Jun - 25 Jun"
      normal: "25 Jun - 10 Jul"
      late: "10 Jul - 20 Jul"
    total_duration_days: 105
    gdd_total: 1600
    kc_mid: 1.15
    root_depth_cm: 70
    mad: 0.50
    source: "ICAR-IISR Indore Technical Bulletin 42 (Soybean Production Technology for Central India), pp. 8-22; FAO-56 Table 12"
    status: "ACTIVE"
    stages:
      - id: "emergence"
