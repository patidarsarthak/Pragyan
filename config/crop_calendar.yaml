        status: "ACTIVE"
      - id: "flowering"
        name: "Flowering & Pod Initiation"
        start_day: 36
        end_day: 60
        gdd_req: 980
        kc: 1.15
        critical: true
        water_requirement: "Critical (Moisture stress induces flower drop)"
        source: "ICAR-IISR Technical Bulletin 42, p. 15"
        status: "ACTIVE"
      - id: "pod_filling"
        name: "Pod Bulking & Seed Filling"
        start_day: 61
        end_day: 85
        gdd_req: 1350
        kc: 1.10
        critical: true
        water_requirement: "High"
        source: "ICAR-IISR Technical Bulletin 42, p. 18"
        status: "ACTIVE"
      - id: "maturity"
        name: "Pod Ripening & Defoliation"
        start_day: 86
        end_day: 105
        gdd_req: 1600
        kc: 0.45
        critical: false
        water_requirement: "Low"
        source: "ICAR-IISR Technical Bulletin 42, p. 20"
        status: "ACTIVE"

  maize:
    canonical_name: "Maize"
    scientific_name: "Zea mays"
    season: "Kharif"
