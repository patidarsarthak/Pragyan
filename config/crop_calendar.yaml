# Authoritative Agro-Climatic Crop Calendar for Madhya Pradesh
# Citing:
# 1. JNKVV Jabalpur & RVSKVV Gwalior: Package of Practices for Field Crops of Madhya Pradesh (Rabi & Kharif)
# 2. ICAR-Indian Institute of Soybean Research (IISR), Indore: Technical Bulletin on Soybean Production Technology
# 3. ICAR-Indian Institute of Pulses Research (IIPR), Kanpur: Chickpea Production Technology & Weather Sensitivity
# 4. ICAR-Directorate of Rapeseed-Mustard Research (DRMR), Bharatpur: Agro-Meteorological Advisory Protocol
# 5. FAO Irrigation and Drainage Paper No. 56: Crop Evapotranspiration (Kc and Depletion Fraction MAD)

version: "2.0"
state: "Madhya Pradesh"
primary_zones: ["ACZ-MP-06 (Malwa Plateau)", "ACZ-MP-07 (Central Narmada Valley)", "ACZ-MP-05 (Vindhyan Plateau)"]

crops:
  wheat:
    canonical_name: "Wheat"
    scientific_name: "Triticum aestivum"
    season: "Rabi"
    base_temperature_c: 4.5 # Sourced: Porter & Gawith (1999), JNKVV Wheat Agromet Bulletin
    sowing_window:
      early: "25 Oct - 05 Nov"
      normal: "05 Nov - 25 Nov"
      late: "25 Nov - 15 Dec"
    total_duration_days: 120
    gdd_total: 1850 # Accumulated GDD (base 4.5C) to maturity
    kc_mid: 1.15 # FAO-56 Table 12
    root_depth_cm: 90
    mad: 0.55 # Management Allowed Depletion (FAO-56)
    source: "JNKVV Package of Practices for Rabi Crops (Wheat), pp. 12-28; FAO-56 Table 12"
    status: "ACTIVE"
    stages:
      - id: "crown_root_initiation"
        name: "Crown Root Initiation (CRI)"
        start_day: 0
        end_day: 25
        gdd_req: 280
        kc: 0.70
        critical: true
        water_requirement: "Critical (Mandatory 1st Irrigation at 21 DAS)"
        source: "JNKVV Package of Practices for Rabi Crops (Wheat), p. 16"
        status: "ACTIVE"
      - id: "tillering"
        name: "Tillering & Jointing"
        start_day: 26
        end_day: 50
        gdd_req: 650
        kc: 0.95
        critical: false
        water_requirement: "Moderate"
        source: "JNKVV Package of Practices for Rabi Crops (Wheat), p. 18"
        status: "ACTIVE"
      - id: "flowering"
        name: "Booting, Heading & Anthesis"
        start_day: 51
        end_day: 80
        gdd_req: 1200
        kc: 1.15
        critical: true
        water_requirement: "Critical (Terminal Heat Sensitivity)"
        source: "JNKVV Package of Practices for Rabi Crops (Wheat), p. 21"
        status: "ACTIVE"
      - id: "grain_filling"
        name: "Milking, Dough & Maturation"
        start_day: 81
        end_day: 120
        gdd_req: 1850
        kc: 0.65
        critical: false
        water_requirement: "Low"
        source: "JNKVV Package of Practices for Rabi Crops (Wheat), p. 24"
        status: "ACTIVE"

  chickpea:
    canonical_name: "Chickpea (Gram)"
    scientific_name: "Cicer arietinum"
    season: "Rabi"
    base_temperature_c: 8.0 # Sourced: Singh & Virmani (1996), ICAR-IIPR
    sowing_window:
      early: "15 Oct - 25 Oct"
      normal: "25 Oct - 15 Nov"
      late: "15 Nov - 05 Dec"
    total_duration_days: 115
    gdd_total: 1650
    kc_mid: 1.00 # FAO-56 Table 12
    root_depth_cm: 80
    mad: 0.60
    source: "ICAR-IIPR Kanpur / RVSKVV Package of Practices for Pulses, pp. 5-18; FAO-56 Table 12"
    status: "ACTIVE"
    stages:
      - id: "establishment"
        name: "Establishment & Early Vegetative"
        start_day: 0
        end_day: 25
        gdd_req: 310
        kc: 0.50
        critical: false
        water_requirement: "Low"
        source: "ICAR-IIPR Pulses Advisory, p. 8"
        status: "ACTIVE"
      - id: "vegetative"
        name: "Branching & Pre-Flowering"
        start_day: 26
        end_day: 50
        gdd_req: 680
        kc: 0.85
        critical: false
        water_requirement: "Moderate"
        source: "ICAR-IIPR Pulses Advisory, p. 11"
        status: "ACTIVE"
      - id: "flowering"
        name: "Flowering & Pod Initiation"
        start_day: 51
        end_day: 85
        gdd_req: 1250
        kc: 1.00
        critical: true
        water_requirement: "Critical (Moisture stress causes flower abortion; excess causes collar rot)"
        source: "RVSKVV Chickpea Bulletin, p. 14"
        status: "ACTIVE"
      - id: "maturity"
        name: "Pod Hardening & Senescence"
        start_day: 86
        end_day: 115
        gdd_req: 1650
        kc: 0.45
        critical: false
        water_requirement: "Low"
        source: "ICAR-IIPR Pulses Advisory, p. 16"
        status: "ACTIVE"

  mustard:
    canonical_name: "Mustard"
    scientific_name: "Brassica juncea"
    season: "Rabi"
    base_temperature_c: 5.0 # Sourced: Morrison et al. (1989), ICAR-DRMR
