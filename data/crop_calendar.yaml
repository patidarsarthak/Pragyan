# SIH26074 - Crop Calendar & Stage Durations (Days After Sowing / Planting)
# Authoritative Source: data/AGRICULTURE_REFERENCE.md
# Citations: ICAR-KVK Dhanbad, Birsa Agricultural University (BAU) Ranchi,
# ICAR-CRIDA Dhanbad Contingency Plan, FAO Irrigation and Drainage Paper No. 56.

version: "1.0"
region: "Central and North Eastern Plateau Zone (Agro-Climatic Zone IV - Dhanbad)"

crops:
  paddy:
    canonical_name: "Paddy / Rice"
    scientific_name: "Oryza sativa"
    season: "Kharif"
    total_duration_days: 125
    kc_mid: 1.20
    root_depth_cm: 60
    mad: 0.20 # Maximum Allowable Depletion (high sensitivity)
    stages:
      - id: "nursery"
        name: "Nursery / Seedling"
        start_day: 0
        end_day: 25
        water_requirement: "Moderate"
        critical: false
        advisory_key: "paddy_nursery"
      - id: "tillering"
        name: "Active Tillering"
        start_day: 26
        end_day: 50
        water_requirement: "High (Maintain 2-3 cm)"
        critical: true
        advisory_key: "paddy_tillering"
      - id: "flowering"
        name: "Panicle Initiation to Flowering"
        start_day: 51
        end_day: 85
        water_requirement: "Critical (Maintain 5 cm standing water)"
        critical: true
        advisory_key: "paddy_flowering"
      - id: "maturity"
        name: "Grain Filling & Maturity"
        start_day: 86
        end_day: 125
        water_requirement: "Declining (Drain 10 days before harvest)"
        critical: false
        advisory_key: "paddy_maturity"

  maize:
    canonical_name: "Maize"
    scientific_name: "Zea mays"
    season: "Kharif"
    total_duration_days: 90
    kc_mid: 1.15
    root_depth_cm: 80
    mad: 0.50
    stages:
      - id: "seedling"
        name: "Germination & Seedling"
        start_day: 0
        end_day: 15
        water_requirement: "Low"
        critical: false
        advisory_key: "maize_seedling"
      - id: "vegetative"
        name: "Knee-high Vegetative"
        start_day: 16
        end_day: 35
        water_requirement: "Moderate"
        critical: false
        advisory_key: "maize_vegetative"
      - id: "flowering"
        name: "Tasseling & Silking"
        start_day: 36
        end_day: 60
        water_requirement: "Critical (Tassel Blast Risk)"
        critical: true
        advisory_key: "maize_flowering"
      - id: "maturity"
        name: "Grain Filling & Cob Maturation"
        start_day: 61
        end_day: 90
        water_requirement: "Low (Requires dry weather for drying)"
        critical: false
        advisory_key: "maize_maturity"

  soybean:
    canonical_name: "Soybean"
    scientific_name: "Glycine max"
    season: "Kharif"
    total_duration_days: 105
    kc_mid: 1.15
    root_depth_cm: 70
    mad: 0.50
    stages:
      - id: "emergence"
        name: "Emergence & Early Vegetative"
        start_day: 0
        end_day: 15
        water_requirement: "Low"
        critical: false
        advisory_key: "soybean_emergence"
      - id: "vegetative"
        name: "Branching & Canopy Development"
        start_day: 16
        end_day: 35
        water_requirement: "Moderate"
        critical: false
        advisory_key: "soybean_vegetative"
      - id: "flowering"
        name: "Flowering & Pod Initiation"
        start_day: 36
        end_day: 60
        water_requirement: "Critical (Moisture stress causes flower drop)"
        critical: true
        advisory_key: "soybean_flowering"
      - id: "pod_filling"
        name: "Pod Bulking & Seed Filling"
        start_day: 61
        end_day: 85
        water_requirement: "High"
        critical: true
        advisory_key: "soybean_pod_filling"
      - id: "maturity"
        name: "Pod Ripening & Defoliation"
        start_day: 86
        end_day: 105
        water_requirement: "Low"
        critical: false
        advisory_key: "soybean_maturity"

  wheat:
