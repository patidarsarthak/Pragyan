# ==============================================================================
# Pragyan Official Regional Registry (regions.yaml)
# Single Source of Truth for ML Coverage and Scope Gating
# ==============================================================================

version: "2.0"
default_region: "madhya_pradesh"

regions:
  - id: "madhya_pradesh"
    state_id: "IN-MP"
    name: "Madhya Pradesh"
    display_title: "Madhya Pradesh Pilot Basin (55 Districts)"
    state: "Madhya Pradesh"
    state_code: 23
    level: "state"
    ml_active: true
    status: "PILOT_EVALUATION"
    visible: true
    coverage_class: "ML_ACTIVE"
    bounding_box: [74.04, 21.08, 82.81, 26.87]
    model_version: "MP-Downscaler-v1.0.4"
    grid_resolution_deg: 0.01 # ~1km
    forecast_lead_days: 10
    panchayat_count: 603
    official_lgd_panchayats: 23043
    agro_climatic_zone: "Central Plateau and Hills (Zone VIII) & Western Plateau (Zone IX)"
    primary_crops: ["durum_wheat", "bread_wheat", "chickpea", "mustard", "soybean", "maize", "cotton"]
    validation_status: "PILOT EVALUATION TIER (Out-of-Region Transfer from Dhanbad Baseline)"
    independent_stations: 8

  - id: "dhanbad_jharkhand"
    state_id: "IN-JH"
    name: "Dhanbad Development Archive"
    display_title: "Dhanbad Historical Testbed"
    state: "Jharkhand"
    state_code: 20
    level: "district"
    ml_active: false
    status: "DEVELOPMENT_ARCHIVE"
    visible: false
    coverage_class: "OUTSIDE_COVERAGE"
    bounding_box: [86.05, 23.60, 86.60, 24.05]
    model_version: "v2.0-joint-ensemble-archive"
    grid_resolution_deg: 0.1
    forecast_lead_days: 10
    panchayat_count: 239
    official_lgd_panchayats: 239
    notes: "Archived holdout development region. Excluded from public queries and active UI."

# All other Indian States/UTs are implicitly OUTSIDE_COVERAGE with ml_active: false
default_unmodelled:
  ml_active: false
  status: "OUTSIDE_COVERAGE"
  coverage_class: "OUTSIDE_COVERAGE"
  message: "Outside ML coverage (not modelled). Not covered in this pilot. No forecasts are produced here."
