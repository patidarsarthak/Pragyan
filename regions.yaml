# ==============================================================================
# SIH26074: Config-Driven Regional Registry (regions.yaml)
# Enables seamless national expansion from Dhanbad to all-India without code edits
# ==============================================================================

version: "1.0"
default_region: "dhanbad_jharkhand"

regions:
  - id: "dhanbad_jharkhand"
    name: "Dhanbad Pilot Cluster"
    state: "Jharkhand"
    state_code: 20
    is_pilot: true
    bounding_box: [86.05, 23.60, 86.60, 24.05] # [min_lon, min_lat, max_lon, max_lat]
    model_version: "v2.0-joint-ensemble"
    grid_resolution_deg: 0.1
    forecast_lead_days: 10
    static_terrain_path: "data/static/panchayat_terrain_landcover.csv"
    panchayat_count: 239
    agro_climatic_zone: "Eastern Plateau and Hills (Zone VII)"
    primary_crops: ["Paddy", "Maize", "Mustard", "Vegetables"]

  - id: "ranchi_jharkhand"
